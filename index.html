<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="preload" href="assets/fonts/Monocraft.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="icon" type="image/png" href="assets/ui/game_icon_512.png" />
    <title>Рудная лихорадка: Тайна алмазных недр</title>
    <style>
        /* Monocraft — векторный пиксельный шрифт блочного стиля (OFL-1.1), полная кириллица */
        @font-face {
            font-family: 'Monocraft';
            src: url('assets/fonts/Monocraft.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
            font-display: block;
        }
        @font-face {
            font-family: 'Inter';
            src: url('assets/fonts/Inter.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
            font-display: swap;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            overflow: hidden;
        }
        #game {
            width: 100%;
            height: 100%;
        }
        #game canvas {
            image-rendering: pixelated;
            /* Тач: нативный скролл/зум страницы не должен мешать игре (адаптив) */
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
    <!--
    Этап 2 (Яндекс Игры): раскомментировать для подключения SDK.
    <script src="https://yandex.ru/games/sdk/v2"></script>
    -->
</head>
<body>
    <div id="game"></div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
